server:
  port: ${PORT:8080}

spring:
  datasource:
    # Sunucuda docker-compose'un geçtiği SPRING_DATASOURCE_* değişkenleri
    # aşağıdaki değerleri otomatik ezer. Buradaki değerler LOCAL geliştirme içindir
    # (kendi bilgisayarınızda da bir PostgreSQL çalıştırıyorsanız).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
    username: ${SPRING_DATASOURCE_USERNAME:appuser}
    password: ${SPRING_DATASOURCE_PASSWORD:localsifre}
    driver-class-name: org.postgresql.Driver

  jackson:
    # Tarihleri Türkiye saat diliminde seri hale getir (TimeZoneConfig ile tutarlı).
    time-zone: Europe/Istanbul

  mail:
    host: smtp.gmail.com
    port: 587
    username: ereniridere7@gmail.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      # İlk kurulumda tabloların otomatik oluşması için 'update' (Yol B).
      # Yapı oturunca sunucuda SPRING_JPA_HIBERNATE_DDL_AUTO=validate yapın.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: Europe/Istanbul

# JWT imzalama ayarları.
# secret-key'in BİLEREK varsayılanı yoktur: JWT_SECRET tanımlı değilse uygulama
# açılmaz. Böylece sunucuda env unutulursa sessizce zayıf/bilinen bir anahtarla
# çalışma riski kalmaz. Yeni anahtar üretmek için: openssl rand -base64 32
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:86400000} # 24 saat (ms)
      refresh-token:
        expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 gün (ms)

# Supabase Storage yerine kendi MinIO'muz (S3 uyumlu).
# Değerler docker-compose env'inden gelir; aşağıdakiler local varsayılanı.
storage:
  # endpoint: S3 SDK'nın yükleme/indirme için bağlandığı adres (sunucu içi: http://minio:9000).
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  # public-url: mobil istemciye DÖNDÜRÜLEN URL'in tabanı. Telefondan erişilebilir olmalı
  # (test: http://SUNUCU_IP:9000, sonra https://cdn.domain.com). Verilmezse endpoint kullanılır.
  public-url: ${STORAGE_PUBLIC_URL:${STORAGE_ENDPOINT:http://localhost:9000}}
  access-key: ${STORAGE_ACCESS_KEY:minioadmin}
  secret-key: ${STORAGE_SECRET_KEY:minioadmin}
  bucket: ${STORAGE_BUCKET:komsum-images}
  region: ${STORAGE_REGION:us-east-1}
  # MinIO yol-stili adresleme gerektirir; AWS S3 SDK'da forcePathStyle=true demektir.
  path-style-access: true